plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
}

base {
    archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { name = "Meteor Dev Releases"; url = "https://maven.meteordev.org/releases" }
    maven { name = "Meteor Dev Snapshots"; url = "https://maven.meteordev.org/snapshots" }
    maven { name = "OpenCollab Releases"; url = "https://repo.opencollab.dev/maven-releases/" }
    maven { name = "OpenCollab Snapshots"; url = "https://repo.opencollab.dev/maven-snapshots/" }
}
configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "meteordevelopment:meteor-client:${project.meteor_version}"
    shade("org.geysermc.mcprotocollib:protocol:${project.mcprotocollib_version}") {
        exclude group: "org.slf4j"
        exclude group: "org.apache.logging.log4j"
        exclude group: "com.google.code.gson"
        exclude group: "com.google.guava"
        exclude group: "it.unimi.dsi"
        exclude group: "com.mojang"
        ["buffer", "codec", "common", "handler", "resolver", "transport",
         "transport-classes-epoll", "transport-native-unix-common", "transport-native-epoll"].each {
            exclude group: "io.netty", module: ("netty-" + it).toString()
        }
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ configurations.shade.collect { it.isDirectory() ? it : zipTree(it) } }) {
        exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA", "module-info.class", "META-INF/versions/*/module-info.class"
        exclude "it/unimi/**"
        exclude "io/netty/channel/unix/**", "io/netty/channel/epoll/**", "io/netty/channel/kqueue/**"
        exclude "io/netty/channel/uring/**", "META-INF/native/**", "META-INF/native-image/**"
    }
}


processResources {
    def props = [
        version   : project.version,
        mc_depend : project.mc_depend
    ]
    inputs.properties(props)
    filesMatching("fabric.mod.json") { expand props }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}
